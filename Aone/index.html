<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Aone ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <svg viewBox="0 0 700 600">

            <!-- Invisible heart path -->
            <path
                id="heartPath"
                d="
                M 350 500
                C 330 470, 100 330, 100 180
                C 100 70, 240 50, 350 170
                C 460 50, 600 70, 600 180
                C 600 330, 370 470, 350 500
                Z
                "
            />

            <!-- First moving text -->
            <text class="love-text">
                <textPath id="movingText" href="#heartPath">
                    I love you Aone ❤️ I love you Aone ❤️ I love you Aone ❤️
                </textPath>
            </text>

            <!-- Second moving text -->
            <text class="love-text second">
                <textPath id="movingText2" href="#heartPath">
                    I love you Aone ❤️ I love you Aone ❤️ I love you Aone ❤️
                </textPath>
            </text>

        </svg>


        <!-- Aone's photos -->
        <div class="photos">

            <div class="photo-frame">
                <img src="aone 1. jpg.jpeg" alt="Aone">
            </div>

            <div class="photo-frame">
                <img src="aone 2. jpg.jpeg" alt="Aone">
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
